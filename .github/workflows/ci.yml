# CI for ai-agent-studio
# Runs the repository's own test suite and, where present, its verification script.
# Generated by the enterprise-hardening pass (2026-10-04) against the repository's
# actual tree. Each step runs something that exists here.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          # requirements.txt omits sentence-transformers, but app/rag/vector_store.py:17
          # builds chromadb's SentenceTransformerEmbeddingFunction("all-MiniLM-L6-v2"),
          # which imports sentence_transformers (and therefore torch) at call time and
          # raises ValueError when it is absent. The CPU-only torch index keeps this
          # from pulling ~2GB of CUDA wheels into a runner that has no GPU. The missing
          # manifest line is a repository fix and is reported separately.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install sentence-transformers
      - name: Run the test suite
        run: python -m pytest -q

  mutation-control:
    name: The test suite gate can fail
    runs-on: ubuntu-latest
    # No `needs`: the reverse control has to run whether or not the suite is green,
    # or it only demonstrates something on the runs where nothing is broken.
    if: always()
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Corrupt a collected test file and require a non-zero exit
        run: |
          set -uo pipefail
          # A file pytest actually collects. tests/test_*.py is what the suite runs;
          # corrupting a module it never imports would prove nothing.
          target=$(git ls-files 'tests/test_*.py' | head -1)
          if [ -z "$target" ]; then
            target=$(git ls-files '*test*.py' | head -1)
          fi
          if [ -z "$target" ]; then
            echo "FAIL: no test file is tracked, so the suite has nothing to collect"
            exit 1
          fi
          echo "--- baseline ---"
          # The suite must be green first; otherwise a failure after corrupting a file
          # would be indistinguishable from a suite that was already broken.
          if ! python -m pytest -q --collect-only > /dev/null 2>&1; then
            echo "FAIL: pytest cannot even collect the unmodified suite"
            exit 1
          fi
          echo "collection passed"
          echo "--- corrupting $target ---"
          cp "$target" /tmp/test.bak
          printf '\n\ndef __mutation_control__(:\n' >> "$target"
          # Collection only. The full suite here installs sentence-transformers and
          # downloads all-MiniLM-L6-v2 at call time, which does not finish in a CI
          # window — so asserting on a full run would time out rather than demonstrate
          # anything. A syntax error breaks collection, which is the same gate the real
          # run goes through before any test executes.
          if python -m pytest -q --collect-only; then
            echo "FAIL: pytest collected a test file with a syntax error"
            exit 1
          fi
          cp /tmp/test.bak "$target"
          echo "OK: pytest refused to collect the corrupted test file"

  secret-scan:
    # Full history: a key leaked in an old commit is still a live key. The CLI is
    # used rather than gitleaks-action, which needs GITHUB_TOKEN to scan pull
    # requests and so turns every Dependabot PR red for an unrelated reason --
    # and a PR runs the workflow from its own branch, so a fix on main does not
    # take effect until the branch is regenerated. Pinned, not latest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --verbose
