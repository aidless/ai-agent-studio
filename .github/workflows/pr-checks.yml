name: PR Checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.11"
    - name: Compile Python sources
      run: python -m compileall -q .
# Behavioral checks are the CI workflow's `make check`. This file does not
# install dependencies and a green run here does not mean tests passed.
